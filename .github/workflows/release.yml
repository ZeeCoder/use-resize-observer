name: Release
on:
  push:
    branches:
      - master
      - alpha
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required for npm Trusted Publishing (OIDC): npm mints a short-lived token
      # from this GitHub OIDC token at publish time — no NPM_TOKEN needed, and
      # provenance is attached automatically.
      id-token: write
    steps:
      # fetch-depth: 0 so semantic-release sees the full history + tags (it
      # determines the last release from tags like v9.1.0).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      # node >= 22.14 satisfies @semantic-release/npm@13's engines.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # @semantic-release/npm runs `npm publish` from the runner's npm (its bundled
      # copy isn't on PATH under pnpm), and npm Trusted Publishing (OIDC) needs
      # npm >= 11.5.1 — newer than the npm bundled with Node 22.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install --global npm@latest
      - name: Installing Dependencies
        run: pnpm install --frozen-lockfile
      - name: Building
        run: pnpm build
      - name: Releasing
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
