name: Release
on:
  push:
    branches:
      - master
      - alpha
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installing Dependencies
        run: pnpm install --frozen-lockfile
      - name: Building
        run: pnpm build
      - name: Releasing
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Publish with npm provenance (requires the id-token: write permission above).
          NPM_CONFIG_PROVENANCE: true
